version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: e-haat-server
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=8080
    networks:
      - ehaat-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: e-haat-client
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - ehaat-network

networks:
  ehaat-network:
    driver: bridge
